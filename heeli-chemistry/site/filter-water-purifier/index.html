<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dcecff" />
    <title>自制简易净水器</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="viewport" aria-label="自制简易净水器互动实验">
      <section class="stage is-ready" id="stage">
        <button class="fullscreen-control" id="fullscreenButton" type="button" aria-label="进入全屏" title="进入全屏" aria-pressed="false">
          <svg class="fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" /></svg>
          <svg class="fullscreen-icon-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5" /></svg>
          <span>全屏</span>
        </button>
        <video class="lab-background scene-layer" id="labVideo" muted playsinline preload="auto" poster="./media/7e24134950316b5105ac884d793f8e48d8a534b657e6ef23da313ccef22886db.webp" aria-label="实验室中的简易净水装置">
          <source src="./media/4fb0b8a598655c49f565a184c5f0e32a9174d9834c01b559030c13a33539b992.mp4" type="video/mp4" />
        </video>
        <video class="beaker-overlay scene-layer" id="beakerOverlay" muted playsinline preload="auto" aria-hidden="true">
          <source src="./media/b6677a98722cc1f74f2930ff9a405a49763ed1ab1dd85808bd7b2153139c1a9f.mp4" type="video/mp4" />
        </video>
        <img class="video-end-frame scene-layer" id="videoEndFrame" src="./media/a1e02893417a6ee8efb673f8e5ce51590780ab57ed267136f7adfbbf81a4e7e0.png" alt="过滤结束画面" />
        <img class="material-layout scene-layer" id="materialLayout" src="./media/c4fb00e71ab76c3838d5c258d0eec69362e378d21b289fb8ed4714f674ce647d.webp" alt="当前四层滤材排列" />

        <div class="filter-controls">
          <div class="corner-actions" aria-label="实验操作">
            <button class="action start" id="startButton" type="button"><span class="play">▶</span><span>开始过滤</span></button>
            <button class="action reset" id="resetButton" type="button"><span class="reset-icon">↻</span><span>重置</span></button>
          </div>
          <div class="filter-progress" id="filterProgress">
            <div class="progress-meta">
              <span>过滤进度</span>
              <strong id="progressValue">0%</strong>
            </div>
            <div class="progress-row">
              <span class="progress-end">0%</span>
              <div class="progress-track" id="progressTrack" role="slider" tabindex="0" aria-label="过滤进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
                <div class="progress-fill" id="progressFill"></div>
                <i class="progress-tick" style="--p:25%"></i>
                <i class="progress-tick" style="--p:50%"></i>
                <i class="progress-tick" style="--p:75%"></i>
                <i class="progress-thumb" id="progressThumb"></i>
              </div>
              <span class="progress-end">100%</span>
            </div>
          </div>
        </div>

        <div class="layout-tests" id="layoutTests" aria-label="第一阶段排列图测试">
          <span>覆盖图测试</span>
          <button class="active" data-order="granite-sand-carbon-cotton" type="button">方案 A</button>
          <button data-order="sand-carbon-cotton-granite" type="button">方案 B</button>
          <button data-order="carbon-cotton-granite-sand" type="button">方案 C</button>
          <button data-order="cotton-granite-sand-carbon" type="button">方案 D</button>
        </div>

        <div class="layer-labels" aria-label="净水器滤层说明">
          <article class="layer layer-slot-1"><strong>花岗岩</strong><span>挡住大颗粒</span></article>
          <article class="layer layer-slot-2"><strong>石英砂</strong><span>过滤细小泥沙</span></article>
          <article class="layer layer-slot-3"><strong>活性炭</strong><span>吸附杂质和异味</span></article>
          <article class="layer layer-slot-4"><strong>净水棉</strong><span>拦截碎屑，最后把关</span></article>
        </div>

        <div class="flow-arrow" aria-hidden="true"><i></i><b>水<br />流<br />方<br />向</b></div>

        <img class="tip-panel" src="./media/3b8415364cc4716fb21ffa2952df1ca53df5e3ab6fb804338e713114bbd0c33e.png" alt="课堂提示：净化后的水也不能直接饮用，真实饮用水还需要更严格的处理和检测。" />

        <section class="control-panel" aria-label="过滤控制面板">
          <img src="./media/3179ebd1b89ea8cd6de462c13d4dd7443a39bed19981c05b632550774c76ffb5.png" alt="推荐顺序：花岗岩、石英砂、活性炭、净水棉。简易净水器不能大量降低TDS，主要去除泥沙、异味、色素。" />
          <div class="readings" aria-label="TDS 示意读数，基本不变，不代表澄清度">
            <article class="reading"><b class="reading-num">286</b><em>原水</em></article>
            <article class="reading"><b class="reading-num">286</b><em>第1层</em></article>
            <article class="reading"><b class="reading-num">286</b><em>第2层</em></article>
            <article class="reading"><b class="reading-num">286</b><em>第3层</em></article>
            <article class="reading"><b class="reading-num">286</b><em>出水</em></article>
          </div>
          <div class="status" id="status" aria-live="polite">准备就绪</div>
        </section>

        <section class="order-area" aria-label="可调整滤材摆放顺序">
          <img class="order-panel" src="./media/f27a5dcfd82110c1676746927e4092b494540ca5f12b96f211e65537956b1d91.png" alt="" />
          <div class="materials" id="materials">
            <button class="material" draggable="true" data-id="granite" type="button"><em>1</em><img src="./media/5f236fd35cab44948bc91a37bfc35f4e4cbd2304da73b94fe8f2c8ec094d27d3.png" alt="花岗岩" /><span>花岗岩</span></button>
            <button class="material" draggable="true" data-id="sand" type="button"><em>2</em><img src="./media/9705096098b6dba5e94f646ea13174909a733887058ca62f7d122975010f578b.png" alt="石英砂" /><span>石英砂</span></button>
            <button class="material" draggable="true" data-id="carbon" type="button"><em>3</em><img src="./media/4ceb00638386329046ec1427978c472f02841962e1b14933e4a72239053f18d0.png" alt="活性炭" /><span>活性炭</span></button>
            <button class="material" draggable="true" data-id="cotton" type="button"><em>4</em><img src="./media/d47c93e5c78ea96f73971d7c2dae4be20401f75ac349b2f927ceef502c58c738.png" alt="净水棉" /><span>净水棉</span></button>
          </div>
        </section>

        <div class="scheme-loading" id="schemeLoading" aria-live="polite" aria-hidden="true">
          <div class="scheme-loading-card">
            <span class="scheme-spinner" aria-hidden="true"></span>
            <strong>正在切换方案</strong>
            <span>滤材顺序更新中</span>
          </div>
        </div>
      </section>
    </main>
    <script id="courseware-assets" type="application/json">{}</script><script src="./runtime.js" defer></script>
  
    <div class="courseware-license-watermark" aria-hidden="true">轻页Lab</div>
    <style>
      html, html * { cursor: url("./media/ce397869349bd9d94f85395c1f226b13329b83002cc5c1ae6d148401e2fec41d.png") 17 3, pointer !important; }
      :fullscreen, :fullscreen * { cursor: url("./media/a4ce93e3cd658c152a8d0d851c5bfb3418b5482c658e2fc1561949c9b8b7c5f6.png") 34 6, url("./media/4e5a1fa37656e11067ed75290f523892c62a480ea879887ae5fbab5017172962.png") 27 5, pointer !important; }
      :-webkit-full-screen, :-webkit-full-screen * { cursor: url("./media/a4ce93e3cd658c152a8d0d851c5bfb3418b5482c658e2fc1561949c9b8b7c5f6.png") 34 6, url("./media/4e5a1fa37656e11067ed75290f523892c62a480ea879887ae5fbab5017172962.png") 27 5, pointer !important; }
      :root { scrollbar-color: #8fc4ed #edf7ff; scrollbar-width: thin; }
      * { scrollbar-color: #8fc4ed #edf7ff; scrollbar-width: thin; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: #edf7ff; }
      *::-webkit-scrollbar-thumb {
        min-height: 34px; border: 2px solid #edf7ff; border-radius: 999px;
        background: #8fc4ed;
      }
      *::-webkit-scrollbar-thumb:hover { background: #6eafe0; }
      *::-webkit-scrollbar-corner { background: #edf7ff; }
      .courseware-license-watermark {
        position: fixed; z-index: 100; right: 18px; bottom: 14px;
        max-width: min(460px, calc(100vw - 36px)); padding: 7px 11px;
        overflow: hidden; border: 1px solid rgba(116,169,225,.22);
        border-radius: 999px; color: rgba(20,69,123,.62);
        background: rgba(241,249,255,.5); backdrop-filter: blur(8px);
        font: 700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        letter-spacing: .05em; pointer-events: none; text-overflow: ellipsis;
        white-space: nowrap; user-select: none;
      }
    </style><script src="./portal-bridge.js" defer></script></body>
</html>
